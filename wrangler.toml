# wrangler.toml
name = 'v8qtengine'
main = "./worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
NODE_VERSION = "20"
V8_DATA_PROVIDER = "yahoo"
# VITE_ variables are exposed to the client; safe to set as vars (not secrets)
# Set these via Cloudflare Dashboard → Variables and Secrets → Environment Variables
# VITE_SUPABASE_URL = ""
# VITE_SUPABASE_ANON_KEY = ""
# ⚠️ Set TELEGRAM and SUPABASE SERVICE KEY in Cloudflare dashboard or wrangler secret:
# Dashboard: Settings > Variables and Secrets > Environment Variables
# Or CLI: npx wrangler secret put SUPABASE_URL / npx wrangler secret put SUPABASE_KEY
# (Do NOT define empty SUPABASE_URL/KEY in [vars] as empty strings overwrite Cloudflare dashboard secrets!)
#

[triggers]
crons = [
  "30 21 * * 1-5", # 🌅 [미국장 마감] 06:30 KST (화~토 KST / 월~금 UTC 21:30)
  "30 0 * * 1-5",  # ☀️ [국내장 개장] 09:30 KST (월~금 KST / 월~금 UTC 00:30)
  "40 6 * * 1-5",  # 🏁 [국내장 마감] 15:40 KST (월~금 KST / 월~금 UTC 06:40)
  "0 14 * * 1-5"   # 🌃 [미국장 개장] 23:00 KST (월~금 KST / 월~금 UTC 14:00)
]

# ⚠️ Do NOT add `[limits]` while on the Workers Free plan: it is Standard-model
# only, and free `subrequests` is hard-capped at 50. It fails the upload with a
# plan error even though `--dry-run` passes locally.
# See CLOUDFLARE_DEPLOYMENT.md for subrequest budgeting.

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "v8-scan-chunks"

[[queues.consumers]]
queue = "v8-scan-chunks"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "v8-scan-dead"


