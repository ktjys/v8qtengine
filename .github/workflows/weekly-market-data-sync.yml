name: Weekly Market Data Sync

on:
  schedule:
    # Every Sunday 06:00 KST (21:00 UTC Saturday)
    - cron: '0 21 * * 0'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  sync-market-data:
    name: Sync Market Data to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify Supabase connection
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ Missing Supabase credentials in secrets"
            exit 1
          fi
          echo "✅ Supabase credentials configured"

      - name: Run market data sync
        run: bun run scripts/sync-market-data.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Sync summary
        if: always()
        run: |
          echo "## Weekly Market Data Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ **Status: SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Weekly Market Data Sync Failed',
              body: `The weekly market data sync workflow failed.\n\n**Run:** ${context.runId}\n**Date:** ${new Date().toISOString()}\n\nCheck the workflow logs for details.`,
              labels: ['bug', 'automation', 'data-sync']
            })